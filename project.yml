name: ParkTrack
options:
  # Inert: every target below sets PRODUCT_BUNDLE_IDENTIFIER from $(PARKTRACK_BUNDLE_ID)
  # explicitly, so this is only XcodeGen's fallback for a target that doesn't. Kept in step
  # with the real id anyway rather than left naming a team the app no longer ships under.
  bundleIdPrefix: org.hopetree
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
# Signing and bundle id come from Config/Signing.xcconfig: it holds placeholders and
# optionally includes a gitignored Signing.local.xcconfig with the real values, so a
# commit never carries either.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ParkTrack:
    type: application
    platform: iOS
    sources:
      # The entitlements file is build configuration, not a resource to be copied into the
      # bundle — XcodeGen would otherwise sweep it up along with the Swift files.
      - path: ParkTrack
        excludes:
          - "ParkTrack.entitlements"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PARKTRACK_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: $(PARKTRACK_ENTITLEMENTS)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "ParkMax uses your location to find nearby parks, log visits where you are, and compute how much of the area around you you've explored."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach photos and videos from your library to a park visit."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo or video at a park to attach to your visit."
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        # UIBackgroundModes lives in ParkTrack/Info.plist rather than here, because
        # INFOPLIST_KEY_UIBackgroundModes is accepted and then ignored by the plist
        # generator. See the comment in that file. GENERATE_INFOPLIST_FILE above still
        # applies: the file is the base and the generated keys merge on top.
        INFOPLIST_FILE: ParkTrack/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      # The friends features degrade silently rather than failing: with no iCloud entitlement
      # `CloudKitAvailability` reports unavailable and the app quietly serves three invented
      # friends instead. That is the correct behaviour for a simulator or an unsigned build,
      # and completely wrong for something about to be uploaded — so a device build says so
      # out loud. A warning rather than an error, because building onto your own phone
      # without the paid membership is a legitimate thing to do.
      - name: Verify iCloud entitlement
        basedOnDependencyAnalysis: false
        script: |
          [ "$PLATFORM_NAME" = "iphoneos" ] || exit 0
          entitlements=$(codesign -d --entitlements - --xml "$CODESIGNING_FOLDER_PATH" 2>/dev/null || true)
          case "$entitlements" in
            *icloud-container-identifiers*) exit 0 ;;
          esac
          echo "warning: this build carries no iCloud container entitlement, so CloudKitAvailability will report unavailable."
          echo "warning: the Friends tab will show invented sample data and no park will sync between devices."
          echo "warning: enable the iCloud capability with a CloudKit container on this App ID, or ignore this if the build is only for your own phone."
          echo "warning: if PARKTRACK_ENTITLEMENTS was deliberately left empty — an old bundle id being rebuilt to export a backup — this is expected."
      # Guards against the failure this whole arrangement exists to prevent: a missing
      # Signing.local.xcconfig letting the placeholder id through, installing a second empty
      # ParkTrack next to the real one and looking exactly like the data was wiped.
      - name: Verify signing identity
        basedOnDependencyAnalysis: false
        script: |
          [ "$PLATFORM_NAME" = "iphoneos" ] || exit 0
          case "$PRODUCT_BUNDLE_IDENTIFIER" in
            *CHANGE-ME*)
              echo "error: Config/Signing.local.xcconfig is missing, so this build fell back to the placeholder bundle id '$PRODUCT_BUNDLE_IDENTIFIER'."
              echo "error: Installing it would create a SECOND app on the phone with no parks or visits rather than updating the real one."
              echo "error: Create Config/Signing.local.xcconfig with the two lines for this machine, e.g.:"
              echo "error:     DEVELOPMENT_TEAM = ABCDE12345"
              echo "error:     PARKTRACK_BUNDLE_ID = com.yourprefix.parktrack.app"
              echo "error: Use the SAME PARKTRACK_BUNDLE_ID this machine has always used — changing it orphans the app data already on your phone, and the iCloud records behind friends."
              exit 1
              ;;
          esac
  ParkTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParkTrackTests
    dependencies:
      - target: ParkTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PARKTRACK_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  ParkTrackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ParkTrackUITests
    dependencies:
      - target: ParkTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PARKTRACK_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ParkTrack:
    build:
      targets:
        ParkTrack: all
    run:
      config: Debug
    test:
      config: Debug
      # Two plans rather than one. `Unit` is the default and is the everyday check: the whole
      # thing is seconds. `Full` adds the screen tour, which launches the app five times and
      # lets a real map sweep run — minutes, for an answer only a screenshot can give. Run it
      # with `-testPlan Full` when a change is one you have to look at.
      #
      # A plan, rather than marking the target skipped in the scheme: a skipped target cannot
      # be reached by `-only-testing` either, so there is no way left to run it on purpose.
      testPlans:
        - path: Unit.xctestplan
          defaultPlan: true
        - path: Full.xctestplan
  # Runs the app the way it actually ships: optimised, assertions off. Worth reaching for
  # when judging how something feels, since a Debug build's unoptimised Swift makes the
  # scrolling and the map noticeably heavier than anything a user will ever see.
  ParkTrack (Release):
    build:
      targets:
        ParkTrack: all
    run:
      config: Release
    test:
      config: Release
      testPlans:
        - path: Unit.xctestplan
          defaultPlan: true
        - path: Full.xctestplan
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
